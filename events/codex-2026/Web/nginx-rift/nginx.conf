daemon off;
user root;
worker_processes 1;
error_log logs/error.log;
pid tmp/nginx.pid;
worker_rlimit_core 500M;
working_directory tmp;

events {
    worker_connections 1024;
}

http {
    types {
        text/html                             html htm shtml;
        text/css                              css;
        application/javascript                js;
        image/jpeg                            jpeg jpg;
        image/png                             png;
        image/svg+xml                         svg svgz;
    }

    access_log off;
    client_body_temp_path tmp;
    proxy_temp_path tmp;
    fastcgi_temp_path tmp;
    uwsgi_temp_path tmp;
    scgi_temp_path tmp;

    upstream backend {
        server 127.0.0.1:19323;
    }

    server {
        listen 19322;
        location / { return 200 "backend ok\n"; }
    }

    server {
        listen 19321;
        request_pool_size 7920;
        connection_pool_size 4096;
        client_header_buffer_size 2048;

        # CVE-2026-42945 trigger:
        # - rewrite sets e->is_args = 1 (due to '?' in replacement)
        # - set $original_endpoint $1 allocates buffer using raw capture
        #   length, but copies with escape expansion (3x for '+' chars)
        location ~ ^/api/(.*)$ {
            rewrite ^/api/(.*)$ /internal?migrated=true;
            set $original_endpoint $1;
        }

        location /internal {
            internal;
            proxy_pass http://backend;
            proxy_read_timeout 60s;
        }

        # Spray: POST body stored in pool memory — held open by backend delay
        location /spray {
            client_body_in_single_buffer on;
            proxy_pass http://backend;
            proxy_read_timeout 60s;
        }

        # Debug endpoint — leaks worker memory addresses (intended CTF hint)
        # Discoverable via: gobuster dir -u http://TARGET:19321 -w /usr/share/wordlists/...
        location /debug {
            proxy_pass http://backend;
            proxy_read_timeout 10s;
        }

        # Loot endpoint: exploit writes command output into /tmp, then players can
        # fetch it over HTTP without needing shell/container access.
        location /loot/ {
            alias /tmp/;
            default_type text/plain;
            try_files $uri =404;
        }

        # Serve CTF landing page
        location / {
            root /var/www/html;
            index index.html;
            try_files $uri $uri/ =404;
        }
    }
}
