name: "Bad Practice Dev"
author: "FAZer0"

description: |
  Faz adalah seorang junior web developer yang sedang tekun berlatih membuat situs web menggunakan HTML, CSS, dan JavaScript. Saat sedang mencari inspirasi template di internet, ia tidak sengaja menekan tautan mencurigakan yang mengunduh berkas asing ke komputernya.
  Tak lama setelah berkas tersebut dijalankan, seluruh kode proyek web yang ia buat berubah menjadi berkas asing berakhiran .secret dan tidak dapat dibuka kembali.
  Analisis berkas disk image (.img) yang diberikan menggunakan alat forensik seperti Autopsy. Temukan bagaimana serangan tersebut terjadi, dapatkan kunci dekripsinya, dan pulihkan kembali berkas proyek milik Faz untuk menemukan flag!
