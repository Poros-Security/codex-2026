name: "Gema dari Mahkota Retak"
author: "zanzan"

description: |
  Enam puluh empat titah dibubuhi segel mahkota. Malam itu pandai besi mendengar
  dua bunyi sumbang: satu segel retak saat ditempa, satu lagi rusak di jalan.

  Keduanya tampak palsu di mata rakyat. Namun hanya satu retakan yang masih
  menyimpan gema separuh rahasia mahkota — dan hanya dengan gema itu peti tua
  di ruang khazanah dapat dibuka.

type: "StaticAttachment"
