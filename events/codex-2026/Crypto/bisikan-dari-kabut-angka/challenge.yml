name: "Bisikan dari Kabut Angka"
author: "zanzan"

description: |
  Di observatorium tua, papan angka selalu menjawab dengan kebohongan kecil.
  Jawabannya tidak pernah jauh dari kebenaran, namun cukup melenceng untuk
  menjatuhkan siapa yang percaya pada garis yang terlalu lurus.

  Gangguan itu berpindah di setiap baris. Menyingkirkannya dengan kasar hanya
  menyisakan jawaban palsu. Para penjaga bergumam: kebohongan kecil lebih mudah
  terlihat jika persamaan diangkat ke langit yang lebih luas, lalu dicari bayangan
  paling pendek di dalam kabut.

  Di balik kabut itu, sebuah bisikan menunggu — tersembunyi pada rahasia yang
  sama dengan yang menjaga seluruh papan.

type: "StaticAttachment"
value: 1000
visible: false   # ubah ke true saat kompetisi dimulai

